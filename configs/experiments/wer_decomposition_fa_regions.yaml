# Robustness check (decisions S2): the system comparison of
# wer_decomposition_sortformer_v21.yaml with the forced-alignment reference
# defining both the regions (single / overlap) and the "perfect diarisation"
# turns. Words and their transcripts are unchanged (AMI manual words).

experiment: wer_decomposition_fa_regions

frame_step: 0.001
dataset: configs/data/ami.yaml
words: configs/data/ami_words.yaml
annotation: forced_alignment
partition: test

conditions:
  ihm_mix:
    asr_dir: results/asr/whisper_turbo_cpu/ihm_mix/test
    systems:
      pyannote: results/diarise/pyannote31_published/ihm_mix/test
      sortformer: results/diarise/sortformer_v21/ihm_mix/test
  sdm:
    asr_dir: results/asr/whisper_turbo_cpu/sdm/test
    systems:
      pyannote: results/diarise/pyannote31_published/sdm/test
      sortformer: results/diarise/sortformer_v21/sdm/test

tcp_collar: 5.0
bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/wer_decomposition_fa_regions
