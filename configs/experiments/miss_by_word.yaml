# Check for decisions S1: which single-speaker words a system misses (outputs
# no speaker for), by the length of the reference turn and by word duration.

experiment: miss_by_word

frame_step: 0.001
dataset: configs/data/ami.yaml
words: configs/data/ami_words.yaml
annotation: only_words
partition: test
short_turn_max_words: 2          # as in X3
duration_edges_s: [0.2, 0.4, 0.8]

systems:
  pyannote31_ihm_mix: {hyp_dir: results/diarise/pyannote31_published/ihm_mix/test}
  pyannote31_sdm: {hyp_dir: results/diarise/pyannote31_published/sdm/test}
  sortformer_v21_ihm_mix: {hyp_dir: results/diarise/sortformer_v21/ihm_mix/test}
  sortformer_v21_sdm: {hyp_dir: results/diarise/sortformer_v21/sdm/test}

bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/miss_by_word
