# Extra analysis (decisions.md X1): does pyannote 3.1 output a second speaker
# where the reference has overlap? Speaker-count confusion between the
# reference and the system, in seconds of UEM time, no collar (Full).

experiment: overlap_detection_pyannote31

dataset: configs/data/ami.yaml
annotation: only_words
partition: test
count_cap: 3            # counts >= 3 are pooled as "3+"

systems:
  pyannote31_ihm_mix: {hyp_dir: results/diarise/pyannote31_published/ihm_mix/test}
  pyannote31_sdm: {hyp_dir: results/diarise/pyannote31_published/sdm/test}

bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/overlap_detection_pyannote31
