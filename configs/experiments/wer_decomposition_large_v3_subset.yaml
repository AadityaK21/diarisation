# Check of the turbo deviation (decisions.md X6): the same decomposition for
# large-v3 and large-v3-turbo on the same subset of headset-mix test meetings.
# Two meetings only: compare per meeting; the bootstrap intervals that the
# script also writes mean little with n = 2.

experiment: wer_decomposition_large_v3_subset

frame_step: 0.001
dataset: configs/data/ami.yaml
words: configs/data/ami_words.yaml
annotation: only_words
partition: test
uris: [IS1009a, ES2004a]

conditions:
  ihm_mix_large_v3: {asr_dir: results/asr/whisper_large_v3_cpu/ihm_mix/test, pyannote_dir: results/diarise/pyannote31_published/ihm_mix/test}
  ihm_mix_turbo: {asr_dir: results/asr/whisper_turbo_cpu/ihm_mix/test, pyannote_dir: results/diarise/pyannote31_published/ihm_mix/test}

tcp_collar: 5.0
bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/wer_decomposition_large_v3_subset
