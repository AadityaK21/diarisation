# Extra analysis (decisions.md X7): when two reference speakers overlap and
# pyannote shows only one, is it the louder one? Sampled every `hop` seconds
# inside two-speaker reference overlap; "louder" = higher headset energy in a
# `window` around the sample; system speakers mapped to people with the
# optimal (md-eval) mapping.

experiment: overlap_dominance_pyannote31

frame_step: 0.001
dataset: configs/data/ami.yaml
words: configs/data/ami_words.yaml
annotation: only_words
partition: test
hop: 0.1
window: 0.1

systems:
  pyannote31_ihm_mix: {hyp_dir: results/diarise/pyannote31_published/ihm_mix/test}
  pyannote31_sdm: {hyp_dir: results/diarise/pyannote31_published/sdm/test}

bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/overlap_dominance_pyannote31
