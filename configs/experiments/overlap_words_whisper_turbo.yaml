# Extra analysis (decisions.md X3): which overlapped words are lost?
# Every reference word (attribution) or token (ASR) in overlap is described by
#   role        "first": the speaker's current turn started before every other
#               active speaker's turn (holds the floor); "second": otherwise
#   turn length number of words in the speaker's current turn (a short turn of
#               1-2 words is typically a backchannel such as "yeah")
#   level       10 log10(own headset energy / sum of the other active
#               speakers' headset energies) over the word, in dB. Headset
#               crosstalk bounds what this can resolve (roughly +-20 dB).
# and by two outcomes:
#   asr         deleted / substituted / correct under the DI-cpWER alignment
#               (transcription only, decisions.md X2), per token
#   attribution credited to another talker by the one-speaker-per-word rule
#               with perfect diarisation (step 6a), per word

experiment: overlap_words_whisper_turbo

dataset: configs/data/ami.yaml
words: configs/data/ami_words.yaml
annotation: only_words
partition: test

conditions:
  ihm_mix: {asr_dir: results/asr/whisper_turbo_cpu/ihm_mix/test, pyannote_dir: results/diarise/pyannote31_published/ihm_mix/test}
  sdm: {asr_dir: results/asr/whisper_turbo_cpu/sdm/test, pyannote_dir: results/diarise/pyannote31_published/sdm/test}

short_turn_max_words: 2
level_edges_db: [-10, -5, 0, 5, 10]     # bins: <-10, -10..-5, ..., >=10
min_word_seconds: 0.02                  # shorter words get no level

bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/overlap_words_whisper_turbo
