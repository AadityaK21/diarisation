# Step 6b with NeMo Sortformer as the diarisation (decisions S1): cpWER and
# the fixed mappings (metric B) on the same Whisper words as
# attr_asr_whisper_turbo.yaml. Sortformer outputs at most 4 speakers, so it
# cannot over-cluster a 4-person meeting the way pyannote does.

experiment: attr_asr_sortformer_v21

frame_step: 0.001
dataset: configs/data/ami.yaml
words: configs/data/ami_words.yaml
annotation: only_words
partition: test

runs:
  - {name: sortformer_v21_ihm_mix, asr_dir: results/asr/whisper_turbo_cpu/ihm_mix/test, hyp_dir: results/diarise/sortformer_v21/ihm_mix/test}
  - {name: sortformer_v21_sdm, asr_dir: results/asr/whisper_turbo_cpu/sdm/test, hyp_dir: results/diarise/sortformer_v21/sdm/test}

validate_against_meeteval: true
bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/attr_asr_sortformer_v21
