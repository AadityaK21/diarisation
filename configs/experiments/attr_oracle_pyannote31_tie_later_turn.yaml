# Step 6a: speaker attribution of REFERENCE words (true text, true timing)
# by the diarisation output. No ASR, so every error here is diarisation or
# the word-assignment rule, never recognition.

experiment: attr_oracle_pyannote31_tie_later_turn

frame_step: 0.001
dataset: configs/data/ami.yaml
words: configs/data/ami_words.yaml
annotation: only_words
partition: test

systems:
  # The reference RTTM used as the system: what the one-speaker-per-word rule
  # costs with perfect diarisation.
  oracle_diarisation: {hyp_dir: data/ami/only_words/rttm/test}
  pyannote31_ihm_mix: {hyp_dir: results/diarise/pyannote31_published/ihm_mix/test}
  pyannote31_sdm: {hyp_dir: results/diarise/pyannote31_published/sdm/test}

mappings: [optimal, majority_single]

bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}

out_dir: results/attr_oracle_pyannote31_tie_later_turn

# Robustness: how ties in word-turn overlap are broken (default: label order).
tie_break: later_turn
