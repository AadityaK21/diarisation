# NeMo Sortformer against pyannote 3.1 (decisions S1), paired meeting by
# meeting: difference = Sortformer - pyannote, bootstrap over the 16 test
# meetings, exact sign test on the number of meetings where Sortformer is lower.

experiment: compare_sortformer_pyannote

der: results/decomp_sortformer_v21/per_file.csv
overlap_detection:
  - results/overlap_detection_pyannote31/per_file.csv
  - results/overlap_detection_sortformer_v21/per_file.csv
wer: results/wer_decomposition_sortformer_v21/per_file.csv

pairs:
  - {name: ihm_mix, baseline: pyannote31_ihm_mix, contender: sortformer_v21_ihm_mix,
     wer_condition: ihm_mix, wer_baseline: pyannote, wer_contender: sortformer}
  - {name: sdm, baseline: pyannote31_sdm, contender: sortformer_v21_sdm,
     wer_condition: sdm, wer_baseline: pyannote, wer_contender: sortformer}
  - {name: ihm_mix_dihard3pp, baseline: pyannote31_ihm_mix, contender: sortformer_v21_dihard3pp_ihm_mix,
     wer_condition: ihm_mix, wer_baseline: pyannote, wer_contender: sortformer_dihard3pp}
  - {name: sdm_dihard3pp, baseline: pyannote31_sdm, contender: sortformer_v21_dihard3pp_sdm,
     wer_condition: sdm, wer_baseline: pyannote, wer_contender: sortformer_dihard3pp}

conventions:
  full: {collar: 0.0, exclude_overlap: false}
  fair: {collar: 0.25, exclude_overlap: false}

bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/compare_sortformer_pyannote
