# Frame-level fixed-mapping variant of decomp_pyannote31.yaml.
# Step 5: overlap-conditioned decomposition of pyannote 3.1 on AMI test,
# headset mix (IHM-Mix) and single distant microphone (SDM).

experiment: decomp_pyannote31_singlemap

frame_step: 0.001
collars: [0.0, 0.25]
exclude_overlap: [false, true]

datasets:
  - {config: configs/data/ami.yaml, annotation: only_words, partitions: [test]}

# The authors' published pyannote 3.1 outputs for AMI test (all 16 meetings,
# both conditions). Our own CPU run is a reproduction check, scored separately.
systems:
  pyannote31_ihm_mix: {hyp_dir: results/diarise/pyannote31_published/ihm_mix/test}
  pyannote31_sdm: {hyp_dir: results/diarise/pyannote31_published/sdm/test}

conventions:
  full: {collar: 0.0, exclude_overlap: false}
  fair: {collar: 0.25, exclude_overlap: false}
  forgiving: {collar: 0.25, exclude_overlap: true}
  collar0_no_overlap: {collar: 0.0, exclude_overlap: true}

bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
partition_tol_seconds: 1.0e-6

out_dir: results/decomp_pyannote31_singlemap

# Frame-level preview of the brief's fixed-mapping idea (metric B without
# ASR): the speaker mapping is estimated on single-speaker reference frames
# only and then applied unchanged, overlap included. Everything else is
# identical to decomp_pyannote31.yaml, so the two runs pair file by file.
mapping_region: single
