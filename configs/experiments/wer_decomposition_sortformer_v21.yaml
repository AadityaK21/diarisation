# The X2 decomposition with two diarisation systems on the same Whisper words:
# pyannote 3.1 (published outputs) and NeMo Sortformer (default and DIHARD III
# post-processing). DI-cpWER is taken from all labellings (lowest kept), so
# its value can sit slightly below the pyannote-only run's.
# aggregate.csv gives cpwer_<system>_minus_pyannote, paired over meetings.

experiment: wer_decomposition_sortformer_v21

frame_step: 0.001
dataset: configs/data/ami.yaml
words: configs/data/ami_words.yaml
annotation: only_words
partition: test

conditions:
  ihm_mix:
    asr_dir: results/asr/whisper_turbo_cpu/ihm_mix/test
    systems:
      pyannote: results/diarise/pyannote31_published/ihm_mix/test
      sortformer: results/diarise/sortformer_v21/ihm_mix/test
      sortformer_dihard3pp: results/diarise/sortformer_v21_dihard3pp/ihm_mix/test
  sdm:
    asr_dir: results/asr/whisper_turbo_cpu/sdm/test
    systems:
      pyannote: results/diarise/pyannote31_published/sdm/test
      sortformer: results/diarise/sortformer_v21/sdm/test
      sortformer_dihard3pp: results/diarise/sortformer_v21_dihard3pp/sdm/test

tcp_collar: 5.0
bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/wer_decomposition_sortformer_v21
