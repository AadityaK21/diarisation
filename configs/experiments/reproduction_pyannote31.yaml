# Reproduction check (decisions P2): our own CPU run of pyannote 3.1 against
# the authors' published AMI test outputs, on whichever meetings our run has
# finished. The main results never use our run.

experiment: reproduction_pyannote31

frame_step: 0.001
dataset: configs/data/ami.yaml
annotation: only_words
partition: test

conditions:
  sdm: {ours_dir: results/diarise/pyannote31/sdm/test, published_dir: results/diarise/pyannote31_published/sdm/test}
  ihm_mix: {ours_dir: results/diarise/pyannote31/ihm_mix/test, published_dir: results/diarise/pyannote31_published/ihm_mix/test}

bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/reproduction_pyannote31
