# Alignment check (decisions.md X8): the same decomposition with the turbo
# words as transcribed (faster-whisper cross-attention timestamps) and after
# WhisperX forced alignment. Same words, so DI-cpWER should barely move; any
# change in the word-assignment and diarisation parts comes from timing.

experiment: wer_decomposition_wxalign

frame_step: 0.001
dataset: configs/data/ami.yaml
words: configs/data/ami_words.yaml
annotation: only_words
partition: test

conditions:
  ihm_mix: {asr_dir: results/asr/whisper_turbo_cpu/ihm_mix/test, pyannote_dir: results/diarise/pyannote31_published/ihm_mix/test}
  ihm_mix_wxalign: {asr_dir: results/asr/whisper_turbo_cpu_wxalign/ihm_mix/test, pyannote_dir: results/diarise/pyannote31_published/ihm_mix/test}

tcp_collar: 5.0
bootstrap: {n_resamples: 10000, ci_level: 0.95, seed: 20261002}
out_dir: results/wer_decomposition_wxalign
